<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ДОФАМИН</title>

<style>
body {
    font-family: Arial, sans-serif;
    background:#fff7fb;
    padding:20px;
}

h1 {
    text-align:center;
}

.card {
    background:white;
    padding:20px;
    margin:15px 0;
    border-radius:20px;
    box-shadow:0 3px 10px #ddd;
    font-size:20px;
    cursor:pointer;
}

button {
    background:#ff7aa8;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:20px;
    font-size:16px;
}
</style>

</head>

<body>

<div id="app"></div>


<script>

function home(){

document.getElementById("app").innerHTML = `

<h1>
🛍 ДОФАМИН<br>
всё для декора
</h1>


<div class="card" onclick="ribbons()">
🎀 Ленты
</div>


<div class="card" onclick="beads()">
📿 Бусы
</div>


<div class="card">
🛒 Корзина
</div>

`;

}



function ribbons(){

document.getElementById("app").innerHTML = `

<button onclick="home()">
⬅ Назад
</button>

<h1>🎀 Ленты</h1>

<div class="card" onclick="openProduct('Атласная лента')">
🎀 Атласная лента
</div>

<div class="card" onclick="openProduct('Органза Волна')">
🌊 Органза «Волна»
</div>

<div class="card" onclick="openProduct('Органза')">
🎀 Органза
</div>

<div class="card" onclick="openProduct('Лента тканевая Волна')">
🎀 Лента тканевая «Волна»
</div>

<div class="card" onclick="openProduct('Органза Волна хамелеон')">
✨ Органза «Волна» хамелеон
</div>

<div class="card" onclick="openProduct('Лента со стразами')">
💎 Лента со стразами
</div>

<div class="card" onclick="openProduct('Лента в горошек')">
⚪ Лента в горошек
</div>

<div class="card" onclick="openProduct('Шифоновая лента')">
🎀 Шифоновая лента
</div>

<div class="card" onclick="openProduct('Лента с точками')">
🔘 Лента с точками
</div>

<div class="card" onclick="openProduct('Лента с рисунком')">
🌸 Лента с рисунком
</div>

<div class="card" onclick="openProduct('Кружевная лента')">
🤍 Кружевная лента
</div>

<div class="card" onclick="openProduct('Лента цветочная')">
🌺 Лента цветочная
</div>

`;

}



function beads(){

document.getElementById("app").innerHTML = `

<button onclick="home()">
⬅ Назад
</button>

<h1>📿 Бусы</h1>


<div class="card">
Прозрачные бусы
</div>


<div class="card">
Бусы хамелеон
</div>

`;

}


home();


function openProduct(name) {

if(name === "Атласная лента") {

document.getElementById("app").innerHTML = `

<button onclick="ribbons()">
⬅ Назад
</button>

<h1>🎀 Атласная лента</h1>

<p style="text-align:center">
1 см • 320 м • 580 ₽
</p>

<div class="card">
🔵 Голубая<br>
Остаток: 2
</div>

<div class="card">
🩶 Серая<br>
Остаток: 1
</div>

<div class="card">
✨ Золотая<br>
Остаток: 1
</div>

<div class="card">
🤍 Кремовая<br>
❌ Нет в наличии
</div>

<div class="card">
🌸 Розовая<br>
Остаток: 4
</div>

<div class="card">
🤍 Белая<br>
Остаток: 8
</div>

<div class="card">
🖤 Чёрная<br>
Остаток: 4
</div>

<div class="card">
🍷 Бордовая<br>
❌ Нет в наличии
</div>

`;

} else {

alert("Категория: " + name);

}

</script>

</body>
</html>
