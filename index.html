<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ДОФАМИН — всё для декора</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #fff7fb;
    margin: 0;
    padding: 16px;
    color: #333;
}

h1 {
    text-align: center;
    font-size: 26px;
    margin: 10px 0 20px;
}

h2 {
    text-align: center;
    margin: 10px 0 20px;
}

.card {
    background: white;
    padding: 18px;
    margin: 12px 0;
    border-radius: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.category {
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
}

.product {
    position: relative;
}

.photo {
    height: 180px;
    background: #f7f7f7;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #aaa;
    font-size: 17px;
    margin-bottom: 14px;
}

.product-name {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}

.info {
    line-height: 1.7;
    color: #555;
}

.price {
    font-size: 20px;
    font-weight: bold;
    color: #d65386;
    margin: 10px 0;
}

button {
    background: #ff7aa8;
    color: white;
    border: none;
    padding: 11px 16px;
    border-radius: 20px;
    font-size: 16px;
    cursor: pointer;
    margin: 4px;
}

button:active {
    transform: scale(0.97);
}

.back-button {
    background: #777;
}

.cart-button {
    background: #333;
}

.quantity {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
}

.quantity button {
    width: 40px;
    padding: 8px;
}

.empty {
    text-align: center;
    padding: 30px 10px;
    color: #777;
}

.total {
    font-size: 22px;
    font-weight: bold;
    text-align: center;
    margin: 20px 0;
}

.small {
    color: #888;
    font-size: 14px;
}
</style>
</head>

<body>

<div id="app"></div>

<script>

const products = [
{
id: "test",
category: "Атласные ленты",
name: "Тестовая лента",
width: "1 см",
length: "320 м",
price: 100
}
];


/* =========================
   КОРЗИНА
========================= */

let cart = [];


/* =========================
   ГЛАВНАЯ
========================= */

function home() {

document.getElementById("app").innerHTML = `

<h1>🛍 ДОФАМИН<br>всё для декора</h1>

<div class="card category" onclick="showCategories('ribbons')">
🎀 Ленты
</div>

<div class="card category" onclick="showCategories('beads')">
📿 Бусы
</div>

<div class="card category cart-button" onclick="showCart()">
🛒 Корзина
${cart.length ? " • " + cart.length : ""}
</div>

`;

}


/* =========================
   КАТЕГОРИИ
========================= */

function showCategories(type) {

let categories = [];

if (type === "ribbons") {

categories = [
"Атласные ленты",
"Органза «Волна»",
"Органза 1 см",
"Лента «Волна» тканевая 37 м",
"Органза «Волна» хамелеон 45 м",
"Органза «Волна» хамелеон 9 м",
"Лента со стразами",
"Лента в горошек",
"Шифоновая лента",
"Ленты с точками",
"Лента тканевая «Волна» 9 м",
"Ленты с рисунком",
"Кружево",
"Лента цветочная"
];

} else {

categories = [
"Бусы — прозрачные",
"Бусы — хамелеон"
];

}


let html = `

<button class="back-button" onclick="home()">🏠 Витрина</button>

<h1>${type === "ribbons" ? "🎀 Ленты" : "📿 Бусы"}</h1>

`;

categories.forEach(category => {

html += `

<div class="card category"
onclick="showProducts('${escapeQuotes(category)}')">

${category}

</div>

`;

});

html += `

<div class="card cart-button" onclick="showCart()">
🛒 Корзина
</div>

`;

document.getElementById("app").innerHTML = html;

}


/* =========================
   ТОВАРЫ КАТЕГОРИИ
========================= */

function showProducts(category) {

let items = products.filter(p => p.category === category);

let html = `

<button class="back-button"
onclick="${category.includes("Бусы") ? "showCategories('beads')" : "showCategories('ribbons')}" >
⬅️ Назад
</button>

<button onclick="home()">🏠 Витрина</button>

<h2>${category}</h2>

`;

items.forEach(item => {

html += productCard(item);

});

html += `

<div class="card cart-button" onclick="showCart()">
🛒 Открыть корзину
</div>

`;

document.getElementById("app").innerHTML = html;

}


/* =========================
   КАРТОЧКА ТОВАРА
========================= */

function productCard(item) {

let priceText = item.price > 0
? item.price + " ₽ / бобина"
: "Цена скоро добавим";

return `

<div class="card product">

<div class="photo">
📷<br>
Фото товара
</div>

<div class="product-name">
${item.name}
</div>

<div class="info">

${item.width ? "📏 Ширина: " + item.width + "<br>" : ""}

📦 Длина: ${item.length}

</div>

<div class="price">
💰 ${priceText}
</div>

<button onclick="addToCart('${item.id}')">
➕ Добавить в корзину
</button>

</div>

`;

}


/* =========================
   ДОБАВИТЬ В КОРЗИНУ
========================= */

function addToCart(id) {

let item = products.find(p => p.id === id);

if (!item) return;

let existing = cart.find(p => p.id === id);

if (existing) {

existing.quantity++;

} else {

cart.push({
    id: item.id,
    name: item.name,
    price: item.price,
    quantity: 1
});

}

alert("🛒 Товар добавлен в корзину");

}


/* =========================
   КОРЗИНА
========================= */

function showCart() {

let html = `

<button class="back-button" onclick="home()">
⬅️ Витрина
</button>

<h1>🛒 Корзина</h1>

`;

if (cart.length === 0) {

html += `

<div class="card empty">

🛒 Корзина пока пустая

<br><br>

Добавьте товары из каталога.

</div>

`;

document.getElementById("app").innerHTML = html;

return;

}

let total = 0;

cart.forEach(item => {

let sum = item.price * item.quantity;

total += sum;

html += `

<div class="card">

<div class="product-name">
${item.name}
</div>

<div class="price">
${item.price} ₽ × ${item.quantity}
=
${sum} ₽
</div>

<div class="quantity">

<button onclick="changeQuantity('${item.id}', -1)">
−
</button>

<strong>${item.quantity}</strong>

<button onclick="changeQuantity('${item.id}', 1)">
+
</button>

<button onclick="removeFromCart('${item.id}')">
🗑
</button>

</div>

</div>

`;

});

html += `

<div class="card">

<div class="total">
Итого: ${total} ₽
</div>

<button onclick="checkout()">
✅ Оформить заказ
</button>

</div>

`;

document.getElementById("app").innerHTML = html;

}


/* =========================
   КОЛИЧЕСТВО
========================= */

function changeQuantity(id, change) {

let item = cart.find(p => p.id === id);

if (!item) return;

item.quantity += change;

if (item.quantity <= 0) {

cart = cart.filter(p => p.id !== id);

}

showCart();

}


/* =========================
   УДАЛЕНИЕ
========================= */

function removeFromCart(id) {

cart = cart.filter(p => p.id !== id);

showCart();

}


/* =========================
   ОФОРМЛЕНИЕ
========================= */

function checkout() {

if (cart.length === 0) {

alert("Корзина пустая");

return;

}

alert(
"Заказ собран!\\n\\n" +
"Следующим этапом подключим отправку заказа тебе в Telegram."
);

}


/* =========================
   ЭКРАНИРОВАНИЕ
========================= */

function escapeQuotes(text) {

return text
.replace(/\\/g, "\\\\")
.replace(/'/g, "\\'");

}


/* =========================
   СТАРТ
========================= */
alert("Код загрузился");
    home();

</script>

</body>
</html>
